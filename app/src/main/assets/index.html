<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Image to 3D Studio</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        :root {
            --bg: #0f1115;
            --card: #181b22;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text: #f3f4f6;
            --muted: #9ca3af;
            --border: #2a2f3a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            padding: 14px 18px;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 { font-size: 1.05rem; font-weight: 700; color: #fff; }
        .badge {
            font-size: 0.72rem;
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            padding: 4px 10px;
            border-radius: 99px;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        .viewer-container {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at center, #1e2430 0%, #0f1115 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent;
        }
        .placeholder {
            text-align: center;
            padding: 24px;
            max-width: 320px;
        }
        .placeholder-icon {
            font-size: 3rem;
            margin-bottom: 12px;
            opacity: 0.8;
        }
        .placeholder p {
            color: var(--muted);
            font-size: 0.9rem;
            line-height: 1.5;
        }
        .loader-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 17, 21, 0.9);
            backdrop-filter: blur(6px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            padding: 20px;
            text-align: center;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(59, 130, 246, 0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 14px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status-text { font-size: 0.95rem; font-weight: 600; margin-bottom: 6px; }
        .sub-status { font-size: 0.8rem; color: var(--muted); }
        .controls {
            background: var(--card);
            border-top: 1px solid var(--border);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .preview-bar {
            display: none;
            align-items: center;
            gap: 12px;
            background: #12151b;
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }
        .preview-bar img {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #374151;
        }
        .preview-info { flex: 1; font-size: 0.85rem; color: #e5e7eb; font-weight: 500; }
        .btn-row { display: flex; gap: 10px; }
        .btn {
            flex: 1;
            padding: 13px 16px;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:active { background: var(--accent-hover); transform: scale(0.98); }
        .btn-secondary { background: #262b36; color: #fff; border: 1px solid var(--border); }
        .btn:disabled { opacity: 0.45; pointer-events: none; }
    </style>
</head>
<body>

<header>
    <h1>استوديو التحويل إلى 3D</h1>
    <span class="badge">Native Cloud • v1.4</span>
</header>

<div class="viewer-container">
    <div class="placeholder" id="placeholderBox">
        <div class="placeholder-icon">🧊</div>
        <p>اختر صورة واضحة لعنصر أو شخصية، وسيقوم الذكاء الاصطناعي السحابي ببناء مجسم ثلاثي الأبعاد قابل للتدوير 360 درجة.</p>
    </div>

    <model-viewer id="modelViewer"
        style="display: none;"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        exposure="1.1"
        environment-image="neutral">
    </model-viewer>

    <div class="loader-overlay" id="loaderOverlay">
        <div class="spinner"></div>
        <div class="status-text" id="statusTitle">جاري الاتصال بالسحابة...</div>
        <div class="sub-status" id="statusSub">يتم الآن تحليل أبعاد الصورة وبناء الشبكة الهندسية</div>
    </div>
</div>

<div class="controls">
    <div class="preview-bar" id="previewBar">
        <img id="thumbImg" src="" alt="صورة مختارة">
        <div class="preview-info" id="fileNameText">تم تحميل الصورة بنجاح وجاهزة للتحويل</div>
    </div>

    <div class="btn-row">
        <button id="pickBtn" class="btn btn-secondary">
            📷 اختر صورة
        </button>

        <button id="convertBtn" class="btn btn-primary" disabled>
            ✨ تحويل إلى 3D
        </button>
    </div>
</div>

<script>
    const pickBtn = document.getElementById('pickBtn');
    const convertBtn = document.getElementById('convertBtn');
    const previewBar = document.getElementById('previewBar');
    const thumbImg = document.getElementById('thumbImg');
    const loaderOverlay = document.getElementById('loaderOverlay');
    const statusTitle = document.getElementById('statusTitle');
    const statusSub = document.getElementById('statusSub');
    const placeholderBox = document.getElementById('placeholderBox');
    const modelViewer = document.getElementById('modelViewer');

    pickBtn.addEventListener('click', () => {
        if (window.AndroidBridge && window.AndroidBridge.openGallery) {
            window.AndroidBridge.openGallery();
        }
    });

    convertBtn.addEventListener('click', () => {
        if (window.AndroidBridge && window.AndroidBridge.start3DConversion) {
            loaderOverlay.style.display = 'flex';
            convertBtn.disabled = true;
            pickBtn.disabled = true;
            window.AndroidBridge.start3DConversion();
        }
    });

    window.onImageSelectedFromAndroid = function(dataUrl) {
        thumbImg.src = dataUrl;
        previewBar.style.display = 'flex';
        convertBtn.disabled = false;
    };

    window.updateConversionStatus = function(title, sub) {
        statusTitle.textContent = title;
        statusSub.textContent = sub;
    };

    window.on3DModelReady = function(modelUrl) {
        loaderOverlay.style.display = 'none';
        convertBtn.disabled = false;
        pickBtn.disabled = false;
        placeholderBox.style.display = 'none';
        modelViewer.src = modelUrl;
        modelViewer.style.display = 'block';
    };

    window.onConversionError = function(errorMsg) {
        loaderOverlay.style.display = 'none';
        convertBtn.disabled = false;
        pickBtn.disabled = false;
        alert(errorMsg);
    };
</script>

</body>
</html>
